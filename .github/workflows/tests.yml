name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Xcode 27 preview image (macos-latest only has Xcode 26.x / iOS 26.x).
    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      # Pin 27.2 explicitly; the image's default Xcode is 27.1.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project ChipsLiftingApp.xcodeproj \
            -scheme ChipsLiftingApp \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.2" \
            -only-testing:ChipsLiftingAppTests \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult
